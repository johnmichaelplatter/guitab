[package]
name = "guitab"
version = "0.7.0"
edition = "2024"
repository = "https://github.com/johnmichaelplatter/guitab"
homepage = "https://github.com/johnmichaelplatter/guitab"
licence = "MIT"
description = "guitab — MNX based guitar tablature editor with broad microtonal support"
keywords = ["microtonal", "guitar", "tablature", "tab", "MPE"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
eframe = "0.36"
egui_extras = { version = "0.36", features = ["svg"] }
rfd = "0.14" # Native file dialogs
serde-saphyr = "1.2.0"
image = { version = "0.25", default-features = false, features = ["png"] }
midly = "0.5"
midir = "0.10"
printpdf = "0.7"
epaint_default_fonts = "0.36"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
lto = "thin"
