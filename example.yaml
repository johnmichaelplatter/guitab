mnx:
  version: 1
global:
  measures:
    - time: { count: 4, unit: 4 }
parts:
  - instrument:
      name: "Guitar"
      capo: 2
    measures:
      - sequences:
          - content:
              # ERROR 1: Geometry mismatch. 
              # With capo 2, String 6 Fret 3 physically produces an A2 (MIDI 45).
              # The MNX data incorrectly claims it is a G2 (MIDI 43).
              - duration: { base: quarter }
                notes:
                  - pitch: { step: G, octave: 2 }
                    string: 6
                    fret: 3
                    
              # ERROR 2: Concurrency violation.
              # Attempting to play two different frets on String 1 at the same time.
              - duration: { base: quarter }
                notes:
                  - pitch: { step: F, alter: 1, octave: 4 }
                    string: 1
                    fret: 0
                  - pitch: { step: G, alter: 1, octave: 4 }
                    string: 1
                    fret: 2